name: Run for the money

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  pre-commit:
    name: Pre-commit linting
    runs-on: debian
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      -
          name: Setup Python
          run: apt update && apt install -y python3 python3-pip gettext
      -
          run: pip install pre-commit
          shell: bash
      -
          uses: actions/cache@v4
          with:
            path: ~/.cache/pre-commit
            key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
            restore-keys: |
              ${{ runner.os }}-pre-commit-
      -
          uses: actions/cache@v4
          with:
            path: ~/.cache/pip
            key: ${{ runner.os }}-pip-${{ hashFiles('setup.cfg') }}
            restore-keys: |
              ${{ runner.os }}-pip-
      -
          run: pre-commit run --show-diff-on-failure --color=always --all-files
          shell: bash

  tests:
    strategy:
      fail-fast: true
      matrix:
        include:
          - python: '3.10'
            tox_env: django42-py310
          - python: '3.10'
            tox_env: django50-py310
          - python: '3.10'
            tox_env: no_rest_framework
          - python: '3.11'
            tox_env: django50-py311
          - python: '3.11'
            tox_env: django42-py311
          - python: '3.11'
            tox_env: no_rest_framework
          - python: '3.11'
            tox_env: django51-py311
          - python: '3.12'
            tox_env: django51-py312
          - python: '3.13'
            tox_env: django51-py313
          - python: '3.11'
            tox_env: django52-py311
          - python: '3.12'
            tox_env: django52-py312
          - python: '3.13'
            tox_env: django52-py313
          - python: '3.12'
            tox_env: django_main-py312
          - python: '3.13'
            tox_env: django_main-py313
    name: ${{ matrix.tox_env }}
    runs-on: ubuntu-latest
    container:
      image: "ghcr.io/catthehacker/ubuntu:act-22.04"
      volumes:
        - /opt/hostedtoolcache:/opt/hostedtoolcache

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Goal: We need to somehow cache both pip/uv and the Python setup
      - uses: actions/cache@v4
        with:
          path: ~/.cache
          key: ${{ matrix.tox_env }}-tests

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - run: pip install tox tox-uv coverage uv

      - name: Run ${{ matrix.tox_env }} tox job
        run: tox -e ${{ matrix.tox_env }}

      - run: coverage xml -i
